# Telegram Web K behind a same-origin MTProto relay
#
# The image is built by .github/workflows/build.yml and published to GHCR.
# Copy .env.example to .env and set TWEB_HOST before starting.
services:
  tweb:
    image: ${TWEB_IMAGE:-ghcr.io/<owner>/tweb-relay:latest}
    container_name: ${TWEB_CONTAINER:-tweb}
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.${TWEB_ROUTER:-tweb}.rule=Host(`${TWEB_HOST}`)"
      - "traefik.http.routers.${TWEB_ROUTER:-tweb}.entrypoints=${TRAEFIK_ENTRYPOINT:-https}"
      - "traefik.http.routers.${TWEB_ROUTER:-tweb}.tls=true"
      - "traefik.http.routers.${TWEB_ROUTER:-tweb}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.services.${TWEB_ROUTER:-tweb}.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

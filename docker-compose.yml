# Telegram Web K behind a same-origin MTProto relay — Traefik variant.
#
# The image is built by CI (or locally, see docs/ci.md) without any secrets:
# real api_id/api_hash come from .env and are injected into the bundle when
# the container starts. For a variant without Traefik see
# docker-compose.standalone.yml.
services:
  tweb:
    image: ${TWEB_IMAGE:-ghcr.io/fennr/tweb-relay:latest}
    container_name: ${TWEB_CONTAINER:-tweb}
    restart: unless-stopped
    environment:
      API_ID: ${TWEB_API_ID:?set TWEB_API_ID in .env}
      API_HASH: ${TWEB_API_HASH:?set TWEB_API_HASH in .env}
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.${TWEB_ROUTER:-tweb}.rule=Host(`${TWEB_HOST}`)"
      - "traefik.http.routers.${TWEB_ROUTER:-tweb}.entrypoints=${TRAEFIK_ENTRYPOINT:-https}"
      - "traefik.http.routers.${TWEB_ROUTER:-tweb}.tls=true"
      - "traefik.http.routers.${TWEB_ROUTER:-tweb}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.services.${TWEB_ROUTER:-tweb}.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

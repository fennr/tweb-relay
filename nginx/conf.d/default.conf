server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Traefik is the only thing in front of us; take the client address from it.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Media uploads go straight from the browser to Telegram DCs, this is just a
    # safety net for the small stuff.
    client_max_body_size 64m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/manifest+json
        image/svg+xml;

    # Scanner magnets (.env, .git/config, .aws/credentials, ...) must not get the
    # SPA shell back with a 200.
    location ~ /\. {
        return 404;
    }

    # ---------------------------------------------------------------------
    # Telegram MTProto relay
    #
    # The bundle is built with VITE_TG_RELAY_WS=/tgws and VITE_TG_RELAY_HTTP=/tgw,
    # so instead of connecting to *.web.telegram.org (blocked for the clients
    # this deployment exists for) the browser talks to this host:
    #
    #   wss://<host>/tgws/<dc>[-1]/apiws[ _premium]  -> kws<dc>.web.telegram.org
    #   https://<host>/tgw/<dc>[-1]/apiw1            -> <dc>.web.telegram.org
    #
    # The MTProto payload is end-to-end encrypted between the browser and
    # Telegram, this is a byte relay, not a MITM.
    #
    # DC1=pluto, DC2=venus, DC3=aurora, DC4=vesta, DC5=flora
    # ---------------------------------------------------------------------

    # --- WebSocket transport ---
    location ~ ^/tgws/1(?:-1)?/ {
        include /etc/nginx/snippets/mtproto-ws.conf;
        rewrite ^/tgws/1(?:-1)?(/.*)$ $1 break;
        proxy_pass https://kws1.web.telegram.org;
    }

    location ~ ^/tgws/2(?:-1)?/ {
        include /etc/nginx/snippets/mtproto-ws.conf;
        rewrite ^/tgws/2(?:-1)?(/.*)$ $1 break;
        proxy_pass https://kws2.web.telegram.org;
    }

    location ~ ^/tgws/3(?:-1)?/ {
        include /etc/nginx/snippets/mtproto-ws.conf;
        rewrite ^/tgws/3(?:-1)?(/.*)$ $1 break;
        proxy_pass https://kws3.web.telegram.org;
    }

    location ~ ^/tgws/4(?:-1)?/ {
        include /etc/nginx/snippets/mtproto-ws.conf;
        rewrite ^/tgws/4(?:-1)?(/.*)$ $1 break;
        proxy_pass https://kws4.web.telegram.org;
    }

    location ~ ^/tgws/5(?:-1)?/ {
        include /etc/nginx/snippets/mtproto-ws.conf;
        rewrite ^/tgws/5(?:-1)?(/.*)$ $1 break;
        proxy_pass https://kws5.web.telegram.org;
    }

    # --- HTTPS transport ---
    location ~ ^/tgw/1(?:-1)?/ {
        rewrite ^/tgw/1(?:-1)?(/.*)$ $1 break;
        proxy_pass https://pluto.web.telegram.org;
        include /etc/nginx/snippets/mtproto-http.conf;
    }

    location ~ ^/tgw/2(?:-1)?/ {
        rewrite ^/tgw/2(?:-1)?(/.*)$ $1 break;
        proxy_pass https://venus.web.telegram.org;
        include /etc/nginx/snippets/mtproto-http.conf;
    }

    location ~ ^/tgw/3(?:-1)?/ {
        rewrite ^/tgw/3(?:-1)?(/.*)$ $1 break;
        proxy_pass https://aurora.web.telegram.org;
        include /etc/nginx/snippets/mtproto-http.conf;
    }

    location ~ ^/tgw/4(?:-1)?/ {
        rewrite ^/tgw/4(?:-1)?(/.*)$ $1 break;
        proxy_pass https://vesta.web.telegram.org;
        include /etc/nginx/snippets/mtproto-http.conf;
    }

    location ~ ^/tgw/5(?:-1)?/ {
        rewrite ^/tgw/5(?:-1)?(/.*)$ $1 break;
        proxy_pass https://flora.web.telegram.org;
        include /etc/nginx/snippets/mtproto-http.conf;
    }

    # The app shell must always revalidate: every bundle is content-hashed.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files /index.html =404;
    }

    # Hashed bundles and static media.
    location ~* \.(?:js|mjs|css|wasm|map|json|webmanifest|png|jpe?g|gif|webp|avif|ico|svg|woff2?|ttf|otf|eot|mp3|ogg|opus|mp4|webm|tgs)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Anything else falls back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
